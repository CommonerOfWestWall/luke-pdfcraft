name: Preview update channel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Publication guard regression tests
        run: node --test scripts/update-preview-index.test.mjs
      - name: Verify feed against the actual public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(node -p "JSON.parse(require('fs').readFileSync('updates/windows-x86_64.json','utf8')).latest.tag")"
          gh api "repos/CommonerOfWestWall/luke-pdfcraft/releases/tags/$tag" > "$RUNNER_TEMP/release-receipt.json"
          node scripts/update-preview-index.mjs --release-json "$RUNNER_TEMP/release-receipt.json" --check
